name: Deploy Portfolio
on:
  push:
    branches: [ development ]  # Trigger deployment on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3  # Checkout repository code

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}    # AWS Access Key from repo secrets
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # AWS Secret Key from repo secrets
          aws-region: ${{ secrets.YOUR_REGION }}                                # AWS region for resources

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18  # Node.js version for building frontend

      - name: Build Frontend
        run: |
          cd frontend
          npm ci           # Install dependencies exactly as in package-lock.json
          npm run build    # Build production frontend files

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy Lambda (SAM)
        run: |
          cd backend
          pip install aws-sam-cli
          sam build && sam deploy --no-confirm-changeset --stack-name santosh-portfolio-api --capabilities CAPABILITY_IAM --s3-bucket ${{ secrets.AWS_DEPLOY_BUCKET }}

      - name: Get API Gateway URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name santosh-portfolio-api \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "API_URL=$API_URL" >> $GITHUB_ENV

      - name: Build Frontend with API URL
        run: |
          cd frontend
          echo "VITE_API_URL=$API_URL" > .env
          npm ci
          npm run build

      - name: Upload Frontend to S3
        run: aws s3 sync frontend/dist s3://${{ secrets.AWS_DEPLOY_BUCKET }} --delete

      - name: Upload Frontend to S3
        run: aws s3 sync frontend/dist s3://${{ secrets.AWS_DEPLOY_BUCKET }} --delete